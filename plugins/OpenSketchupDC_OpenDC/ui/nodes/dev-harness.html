<!DOCTYPE html>
<!-- Dev harness for the litegraph node editor: stubs the sketchup bridge
     and mirrors AstGraph.to_formula so preview docs can be asserted as
     formula strings without SketchUp. Not used by the extension. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>nodes harness</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../vendor/litegraph.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #17181c; --bg2: #1e1f24; --bg3: #23242b;
      --fg: #d8d8de; --dim: #a9a9b2; --muted: #8a8a93;
      --accent: #4f9cf9; --accent2: #7fd0a2;
      --warn: #e69664; --error: #e66565; --border: #2a2b31;
      --fn: #b9a5f0;
    }
    html, body { height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font: 11.5px/1.45 "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-bottom: 1px solid var(--border); }
    #ptitle { font-weight: 600; color: var(--accent); }
    #nformula { flex: 1; font: 11px ui-monospace, Consolas, monospace;
      color: var(--dim); overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 7px; background: var(--bg2); }
    #nformula.bad { border-color: var(--error); color: var(--error); }
    #napply { background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 12px; cursor: pointer; font-size: 11px; }
    #napply:disabled { opacity: .4; cursor: default; }
    #lgcanvas { position: absolute; inset: 38px 0 0 0; }
    #ntoast { position: fixed; bottom: 12px; left: 50%;
      transform: translateX(-50%); background: var(--bg3);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 11px; font-size: 11px; opacity: 0; z-index: 40;
      pointer-events: none; }
    #ntoast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <span id="ptitle">Node Editor</span>
    <span id="nformula"></span>
    <button id="napply" disabled>Apply</button>
  </header>
  <canvas id="lgcanvas"></canvas>
  <div id="ntoast"></div>
  <script src="../vendor/litegraph.umd.js"></script>
  <script src="../astkit.js"></script>
  <script src="../dev-emit.js"></script>
  <script>
  // ---- mock Ruby bridge ----------------------------------------------------
  var toFormula = window.ODCDocEmit.toFormula;

  window.__ops = [];
  window.sketchup = {
    nready: function () {},
    nact: function (json) {
      var p = JSON.parse(json);
      window.__ops.push(p);
      window.__lastDoc = p.doc;
      if (p.op === "preview" || p.op === "apply") {
        try {
          var f = toFormula(p.doc || {});
          window.__lastFormula = f;
          window.onNodeStatus({ ok: true, formula: f,
            applied: p.op === "apply" });
        } catch (e) {
          window.__lastFormula = null;
          window.onNodeStatus({ ok: false, errors: [String(e.message)] });
        }
      }
    }
  };
  </script>
  <script src="nodes.js"></script>
  <script>
  // Fixture: entity "Box :: price" - IF formula exercises call slots,
  // const->port collapse, friendly arg labels, and a bin op.
  window.renderNodes({
    entityId: "e1", name: "price", label: "Box :: price",
    formula: "=IF(lenx>10,1,0)",
    graph: {"nodes":{"n3":{"t":"attr","v":"lenx"},"n4":{"t":"const","k":"num","v":"10.0"},"n2":{"t":"bin","v":">"},"n5":{"t":"const","k":"num","v":"1.0"},"n6":{"t":"const","k":"num","v":"0.0"},"n1":{"t":"call","v":"IF"}},"links":[{"f":"n3","t":"n2","p":"a"},{"f":"n4","t":"n2","p":"b"},{"f":"n2","t":"n1","p":"arg0"},{"f":"n5","t":"n1","p":"arg1"},{"f":"n6","t":"n1","p":"arg2"}],"root":"n1"},
    attrs: ["lenx", "leny", "lenz", "price", "area"],
    builtins: ["x", "y", "z", "rotX"],
    globals: ["rate"],
    functions: ["IF", "ROUND", "MIN", "MAX", "PI", "CHOOSE"],
    actions: ["SET", "ANIMATE"],
    fnArity: { IF: 3, ROUND: 1, MIN: 1, MAX: 1, PI: 0, CHOOSE: 2 },
    fnVararg: ["MIN", "MAX", "ROUND", "CHOOSE", "AND", "OR"],
    fnGroups: [
      ["Logical", ["IF", "AND", "OR", "NOT", "TRUE", "FALSE"]],
      ["Math", ["MIN", "MAX", "ROUND", "INT", "PI"]],
      ["Text", ["CONCATENATE", "LEFT", "LEN", "UPPER"]],
      ["SketchUp", ["CHOOSE", "CURRENT", "OPTIONINDEX"]]
    ],
    isAction: false
  });
  </script>
</body>
</html>
