<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open DC - Node Editor</title>
  <style>
    :root {
      --bg: #17181c; --bg2: #1e1f24; --bg3: #23242b;
      --fg: #d8d8de; --dim: #a9a9b2; --muted: #8a8a93;
      --accent: #4f9cf9; --accent2: #7fd0a2;
      --warn: #e69664; --error: #e66565; --border: #2a2b31;
      --fn: #b9a5f0;
    }
    html, body { height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font: 13px/1.45 "Segoe UI", sans-serif; }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg); z-index: 10; position: relative;
    }
    #ptitle { font-weight: 600; color: var(--accent); white-space: nowrap; }
    #nformula {
      flex: 1; font-family: ui-monospace, Consolas, monospace;
      font-size: 12px; color: var(--dim); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 5px;
      padding: 4px 8px; background: var(--bg2);
    }
    #nformula.bad { border-color: var(--error); color: var(--error); }
    #napply {
      background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 4px 14px; cursor: pointer; font-size: 12px;
    }
    #napply:disabled { opacity: .4; cursor: default; }
    #rete { position: absolute; inset: 38px 0 0 0; }

    /* ---- Rete dark theme ---- */
    .node {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; min-width: 110px; padding-bottom: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .node.selected { border-color: var(--accent); }
    .node .title {
      font-family: ui-monospace, Consolas, monospace; font-size: 11px;
      padding: 5px 10px; border-bottom: 1px solid var(--border);
      color: var(--accent); background: rgba(79,156,249,.08);
      border-radius: 8px 8px 0 0; text-align: center;
    }
    .node.const .title { color: var(--warn); background: rgba(230,150,100,.08); }
    .node.call .title { color: var(--fn); background: rgba(185,165,240,.08); }
    .node.ref .title  { color: var(--accent2); background: rgba(127,208,162,.08); }
    .node.act .title  { color: var(--warn); }
    .node .content { padding: 4px 0; }
    .node .socket {
      width: 12px; height: 12px; border-radius: 6px;
      background: var(--bg); border: 2px solid var(--muted);
      display: inline-block; margin: 4px -6px; vertical-align: middle;
    }
    .node .socket:hover, .node .socket.used { border-color: var(--accent2);
      background: var(--accent2); }
    .node .input-title, .node .output-title {
      font-size: 10px; color: var(--muted); padding: 0 8px;
      font-family: ui-monospace, Consolas, monospace;
    }
    .node .output { text-align: right; }
    .node .input { text-align: left; }
    .node input[type=text], .node input[type=number] {
      width: 70px; background: var(--bg2); border: 1px solid var(--border);
      color: var(--fg); border-radius: 4px; padding: 2px 5px;
      font: 11px ui-monospace, Consolas, monospace; margin: 0 8px;
    }
    .node .nval {
      padding: 3px 10px; font: 12px ui-monospace, Consolas, monospace;
      color: var(--fg); text-align: center; word-break: break-all;
    }
    .node .nops {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--fg); border-radius: 4px; padding: 2px 4px;
      font: 12px ui-monospace, Consolas, monospace; margin: 2px 8px;
    }
    .node .addarg {
      background: none; border: 1px dashed var(--border); color: var(--muted);
      border-radius: 4px; font-size: 11px; padding: 1px 8px; margin: 3px 8px;
      cursor: pointer;
    }
    .node .addarg:hover { color: var(--accent); border-color: var(--accent); }
    .connection path { stroke: var(--muted); stroke-width: 2; fill: none; }
    .connection .main-path { stroke: var(--muted); }
    .context-menu {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 0; min-width: 160px;
      box-shadow: 0 6px 18px rgba(0,0,0,.5); z-index: 30;
    }
    .context-menu .item {
      padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--fg);
      font-family: ui-monospace, Consolas, monospace;
    }
    .context-menu .item:hover { background: var(--bg2); color: var(--accent); }
    .context-menu .item .subitems { background: var(--bg3); }
    .context-menu .search input {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--fg); border-radius: 4px; padding: 3px 6px;
      margin: 4px 8px; width: calc(100% - 16px); box-sizing: border-box;
    }
    #ntoast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 12px; font-size: 12px;
      opacity: 0; transition: opacity .2s; z-index: 40; pointer-events: none;
    }
    #ntoast.show { opacity: 1; }
    #ntoast.err { border-color: var(--error); color: var(--error); }
  </style>
</head>
<body>
  <header>
    <span id="ptitle">Node Editor</span>
    <span id="nformula"></span>
    <button id="napply" disabled>Apply</button>
  </header>
  <div id="rete"></div>
  <div id="ntoast"></div>
  <script src="vendor/vue.min.js"></script>
  <script src="vendor/rete.min.js"></script>
  <script src="vendor/connection-plugin.min.js"></script>
  <script src="vendor/vue-render-plugin.min.js"></script>
  <script src="vendor/context-menu-plugin.min.js"></script>
  <script src="nodes.js"></script>
</body>
</html>
