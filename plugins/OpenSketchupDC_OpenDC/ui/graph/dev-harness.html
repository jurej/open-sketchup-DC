<!DOCTYPE html>
<!-- Dev harness for the litegraph dependency graph. Serves the real
     index.html DOM + graph.js with a stubbed sketchup bridge and a mock
     payload. NOT shipped - dev/testing only. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open DC - Dependency Graph (dev)</title>
  <link rel="stylesheet" href="../vendor/litegraph.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #17181c; --bg2: #1e1f24; --bg3: #23242b;
      --fg: #d8d8de; --dim: #a9a9b2; --muted: #8a8a93;
      --accent: #4f9cf9; --accent2: #7fd0a2;
      --warn: #e69664; --error: #e66565; --border: #2a2b31;
      --fn: #b9a5f0;
      --backdrop: rgba(0,0,0,.5);
    }
    html, body { height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font: 11.5px/1.45 "Segoe UI", sans-serif; }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg); z-index: 10; position: relative;
    }
    #gtitle { font-weight: 600; color: var(--accent); white-space: nowrap; }
    #gback {
      display: none; background: var(--bg3); color: var(--accent);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 2px 10px; cursor: pointer; font-size: 11px;
    }
    #gback:hover { border-color: var(--accent); }
    #gcrumb { color: var(--dim); font-size: 11px;
      font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
    .hint { font-size: 10px; color: var(--muted); }
    #gsubbar { display: none; align-items: center; gap: 8px; flex: 1;
      min-width: 0; margin-left: 8px; }
    #gsubformula { flex: 1; min-width: 0;
      font: 10.5px ui-monospace, Consolas, monospace; color: var(--dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 5px;
      padding: 3px 7px; background: var(--bg2); }
    #gsubformula.bad { border-color: var(--error); color: var(--error); }
    #gsubapply { background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 12px; cursor: pointer; font-size: 11px; }
    #gsubapply:disabled { opacity: .4; cursor: default; }
    #gadd {
      margin-left: auto; background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 11px; cursor: pointer; font-size: 11px;
    }
    #lgwrap { position: absolute; inset: 38px 0 0 0; }
    #lgcanvas { width: 100%; height: 100%; display: block; outline: none; }
    #gmsg { position: absolute; top: 60px; left: 0; right: 0;
      text-align: center; color: var(--muted); display: none;
      z-index: 5; pointer-events: none; }
    #gtoast { position: fixed; bottom: 12px; left: 50%;
      transform: translateX(-50%); background: var(--bg3);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 11px; font-size: 11px; color: var(--fg);
      opacity: 0; transition: opacity .2s; z-index: 40;
      pointer-events: none; max-width: 90%; }
    #gtoast.show { opacity: 1; }
    #gtoast.err { border-color: var(--error); color: var(--error); }
    #gconfirm, #gnew { position: fixed; inset: 0; background: var(--backdrop);
      display: none; align-items: center; justify-content: center; z-index: 50; }
    #gconfirm.show, #gnew.show { display: flex; }
    .gdialog { background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; max-width: 320px; }
    .gdialog p { margin: 0 0 12px; }
    .gdialog input[type=text] { width: 100%; box-sizing: border-box;
      margin: 0 0 12px; background: var(--bg3);
      border: 1px solid var(--border); color: var(--fg); border-radius: 5px;
      padding: 4px 7px; font: 11px ui-monospace, Consolas, monospace;
      outline: none; }
    .gdialog input[type=text]:focus { border-color: var(--accent); }
    .gdialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
    .gdialog button { background: var(--bg3); color: var(--fg);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 3px 11px; cursor: pointer; font-size: 11px; }
    .gdialog button.primary { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <button id="gback">&larr; back</button>
    <span id="gtitle">Dependency Graph</span>
    <span id="gcrumb"></span>
    <span id="gsubbar">
      <span id="gsubformula"></span>
      <button id="gsubapply" disabled>Apply</button>
    </span>
    <span class="hint">dev harness - mock payload</span>
    <button id="gadd">+ attr</button>
  </header>
  <div id="lgwrap"><canvas id="lgcanvas" tabindex="1"></canvas></div>
  <div id="gmsg">No parameter dependencies.</div>
  <div id="gtoast"></div>
  <div id="gconfirm"><div class="gdialog">
    <p id="gctext"></p>
    <div class="btns">
      <button id="gccancel">Cancel</button>
      <button id="gcok" class="primary">Replace</button>
    </div>
  </div></div>
  <div id="gnew"><div class="gdialog">
    <p>New attribute name</p>
    <input id="gnewname" type="text">
    <div class="btns">
      <button id="gncancel">Cancel</button>
      <button id="gnok" class="primary">Add</button>
    </div>
  </div></div>
  <script src="../vendor/litegraph.umd.js"></script>
  <script src="../astkit.js"></script>
  <script src="../dev-emit.js"></script>
  <script src="graph.js"></script>
  <script>
    // Stub the sketchup bridge, then feed a representative payload.
    // previewDoc/applyDoc run the dev-emit mirror like the real Ruby path.
    window.__ops = [];
    window.sketchup = {
      gready: function () {},
      gact: function (j) {
        var p = JSON.parse(j);
        window.__ops.push(p);
        console.log("GACT", p.op || p);
        if (p.op === "previewDoc" || p.op === "applyDoc") {
          try {
            var f = window.ODCDocEmit.toFormula(p.doc || {});
            window.__lastSubFormula = f;
            window.onGraphStatus({ ok: true, name: p.name, formula: f,
              applied: p.op === "applyDoc" });
          } catch (e) {
            window.__lastSubFormula = null;
            window.onGraphStatus({ ok: false, name: p.name,
              errors: [String(e.message)] });
          }
        }
      }
    };

    function constDoc(v) {
      return { nodes: { n1: { t: "const", k: "num", v: v } },
               links: [], root: "n1" };
    }

    var payload = {
      label: "Shelf",
      entityId: "42",
      graph: {
        nodes: [
          { id: "width",  level: 0, hasFormula: false },
          { id: "depth",  level: 0, hasFormula: false },
          { id: "height", level: 0, hasFormula: false },
          { id: "thick",  level: 0, hasFormula: true,
            formula: "0.019", doc: constDoc("0.019") },
          { id: "area",   level: 1, hasFormula: true, formula: "width*depth",
            doc: { nodes: {
                     n1: { t: "attr", v: "width" },
                     n2: { t: "attr", v: "depth" },
                     n3: { t: "bin",  v: "*" } },
                   links: [ { f: "n1", t: "n3", p: "a" },
                            { f: "n2", t: "n3", p: "b" } ],
                   root: "n3" } },
          { id: "volume", level: 2, hasFormula: true,
            formula: "area*height*thick",
            doc: { nodes: {
                     n1: { t: "attr", v: "area" },
                     n2: { t: "attr", v: "height" },
                     n3: { t: "bin",  v: "*" },
                     n4: { t: "attr", v: "thick" },
                     n5: { t: "bin",  v: "*" } },
                   links: [ { f: "n1", t: "n3", p: "a" },
                            { f: "n2", t: "n3", p: "b" },
                            { f: "n3", t: "n5", p: "a" },
                            { f: "n4", t: "n5", p: "b" } ],
                   root: "n5" } },
          { id: "price",  level: 2, hasFormula: true,
            formula: "ROUND(area*parent!rate,2)",
            doc: { nodes: {
                     n1: { t: "attr", v: "area" },
                     n2: { t: "ref",  v: "parent!rate" },
                     n3: { t: "bin",  v: "*" },
                     n4: { t: "call", v: "ROUND" },
                     n5: { t: "const", k: "num", v: "2" } },
                   links: [ { f: "n1", t: "n3", p: "a" },
                            { f: "n2", t: "n3", p: "b" },
                            { f: "n3", t: "n4", p: "arg0" },
                            { f: "n5", t: "n4", p: "arg1" } ],
                   root: "n4" } },
          { id: "desc",   level: 3, hasFormula: true,
            formula: 'CONCATENATE("V=",volume)',
            doc: { nodes: {
                     n1: { t: "const", k: "str", v: "V=" },
                     n2: { t: "attr",  v: "volume" },
                     n3: { t: "call",  v: "CONCATENATE" } },
                   links: [ { f: "n1", t: "n3", p: "arg0" },
                            { f: "n2", t: "n3", p: "arg1" } ],
                   root: "n3" } },
          { id: "parent!rate", external: true }
        ],
        edges: [
          { from: "width",  to: "area",   literal: "0.5" },
          { from: "depth",  to: "area",   literal: "0.4" },
          { from: "area",   to: "volume", literal: "0.2" },
          { from: "height", to: "volume", literal: "0.9" },
          { from: "thick",  to: "volume", literal: "0.019" },
          { from: "area",   to: "price",  literal: "0.2" },
          { from: "parent!rate", to: "price", literal: "0" },
          { from: "volume", to: "desc",   literal: "0.162" }
        ]
      },
      palette: {
        attrs: ["width","depth","height","thick","area","volume","price","desc"],
        builtins: ["x","y","z","rotX","rotY","rotZ"],
        globals: ["rate","tax"],
        functions: ["IF","ROUND","MIN","MAX","PI","CONCATENATE","CHOOSE"],
        actions: ["SET","ANIMATE","REDRAW"],
        fnArity: { IF: 3, ROUND: 1, MIN: 1, MAX: 1, PI: 0,
                   CONCATENATE: 1, CHOOSE: 2 },
        fnVararg: ["MIN","MAX","ROUND","CHOOSE","CONCATENATE"],
        fnGroups: [
          ["Logical", ["IF","AND","OR","NOT","TRUE","FALSE"]],
          ["Math", ["MIN","MAX","ROUND","PI"]],
          ["Text", ["CONCATENATE"]],
          ["SketchUp", ["CHOOSE","CURRENT","OPTIONINDEX"]]
        ]
      }
    };

    window.renderGraph(payload);
  </script>
</body>
</html>
