<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open DC - Dependency Graph</title>
  <script src="../theme.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17181c; --bg2: #1e1f24; --bg3: #23242b;
      --fg: #d8d8de; --dim: #a9a9b2; --muted: #8a8a93;
      --accent: #4f9cf9; --accent2: #7fd0a2;
      --warn: #e69664; --error: #e66565; --border: #2a2b31;
      --fn: #b9a5f0;
      --node-shadow: rgba(0,0,0,.35); --menu-shadow: rgba(0,0,0,.55);
      --backdrop: rgba(0,0,0,.5);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eceef1; --bg2: #f6f7f9; --bg3: #ffffff;
      --fg: #23252d; --dim: #565b66; --muted: #747a88;
      --accent: #0d6dd8; --accent2: #157a47;
      --warn: #a05c10; --error: #c4323b; --border: #d3d6dc;
      --fn: #7a5cd0;
      --node-shadow: rgba(0,0,0,.14); --menu-shadow: rgba(0,0,0,.22);
      --backdrop: rgba(0,0,0,.3);
    }
    html, body { height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font: 11.5px/1.45 "Segoe UI", sans-serif; }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg); z-index: 10; position: relative;
    }
    #gtitle { font-weight: 600; color: var(--accent); white-space: nowrap; }
    .hint { font-size: 10px; color: var(--muted); }
    #gadd {
      margin-left: auto; background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 11px; cursor: pointer; font-size: 11px;
    }
    #gadd:hover { background: var(--bg2); }
    #rete { position: absolute; inset: 38px 0 0 0; }
    #gmsg {
      position: absolute; top: 60px; left: 0; right: 0;
      text-align: center; color: var(--muted); display: none;
      z-index: 5; pointer-events: none;
    }

    /* ---- node theme (same canvas family as the formula editor) ---- */
    .node {
      position: relative; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; min-width: 110px;
      box-shadow: 0 2px 8px var(--node-shadow);
      font-family: ui-monospace, Consolas, monospace;
    }
    .node.selected { border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 2px 8px var(--node-shadow); }
    .node.cyc { border-color: var(--error);
      background: rgba(230, 100, 100, .10); }
    .ntitle {
      display: flex; align-items: baseline; gap: 8px;
      padding: 3px 7px; border-bottom: 1px solid var(--border);
      border-radius: 6px 6px 0 0; background: rgba(79,156,249,.07);
    }
    .nkind { font-size: 8.5px; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); }
    .nname {
      flex: 1; font-size: 11px; font-weight: 600; color: var(--fg);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .node.cyc .nname { color: var(--error); }
    .node.ext  .nname { color: var(--accent2); }
    .node.virt .nname { color: var(--accent); }
    .node.ext  .ntitle { background: rgba(127,208,162,.07);
      border-bottom-style: dashed; }
    .node.virt .ntitle { background: rgba(79,156,249,.10);
      border-bottom-style: dashed; }
    .fxbtn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 4px; font-size: 9px; padding: 0 6px; cursor: pointer;
      font-family: inherit; line-height: 14px;
    }
    .fxbtn:hover { color: var(--accent); border-color: var(--accent); }
    .nbody { display: flex; padding: 2px 0; min-height: 18px; }
    .col { display: flex; flex-direction: column; }
    .col.ins  { align-items: flex-start; }
    .col.ctrls { flex: 1; align-items: center; justify-content: center;
      min-width: 0; overflow: hidden; }
    .col.outs { align-items: flex-end; margin-left: auto; }
    .port { display: flex; align-items: center; gap: 4px; }
    .ptitle { font-size: 9px; color: var(--muted); padding-right: 2px; }
    .sock {
      width: 11px; height: 11px; border-radius: 6px; margin: 2px;
      background: var(--bg); border: 2px solid var(--muted); cursor: pointer;
    }
    .sock:hover, .sock.used { border-color: var(--accent2);
      background: var(--accent2); }
    .fxline {
      max-width: 150px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 9.5px; color: var(--dim);
      padding: 0 8px;
    }
    #rete .connection path { stroke: var(--muted); stroke-width: 1.5;
      fill: none; }
    #rete .connection .main-path { stroke: var(--muted); stroke-width: 1.5; }
    #rete .lit .main-path { stroke: var(--accent); stroke-width: 2;
      opacity: 1; }
    #rete .sel .main-path { stroke: var(--accent2); stroke-width: 2.2;
      opacity: 1; }

    /* plugin injects scoped [data-v] styles (blue theme) - #rete out-specifies */
    #rete .context-menu {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 7px; padding: 3px 0; min-width: 170px; width: auto;
      margin: 0; box-shadow: 0 8px 20px var(--menu-shadow); z-index: 30;
      font-family: ui-monospace, Consolas, monospace;
      overflow: visible;
    }
    #rete .context-menu .item {
      color: var(--fg); background: transparent; border: 0;
      padding: 3px 12px; font-size: 10px; cursor: pointer;
      font-family: inherit; width: auto; position: relative;
    }
    #rete .context-menu .item:hover { background: var(--bg2); color: var(--accent); }
    #rete .context-menu .search {
      color: var(--fg); background: transparent; border: 0;
      border-bottom: 1px solid var(--border); padding: 4px; width: auto;
    }
    #rete .context-menu .search input {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--fg); border-radius: 4px; padding: 3px 7px;
      width: 100%; box-sizing: border-box;
      font: 10px ui-monospace, Consolas, monospace; outline: none;
    }
    #rete .context-menu .search input:focus { border-color: var(--accent); }
    #rete .context-menu .subitems {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 7px; box-shadow: 0 8px 20px var(--menu-shadow);
      padding: 3px 0; min-width: 150px;
      max-height: min(340px, calc(100vh - 80px));
      overflow-y: auto; overflow-x: hidden;
    }
    #rete .context-menu .item .subitems { display: none !important; }
    #rete .context-menu .item:hover > .subitems { display: block !important; }

    #gtoast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 11px; font-size: 11px;
      color: var(--fg); opacity: 0; transition: opacity .2s; z-index: 40;
      pointer-events: none; max-width: 90%;
    }
    #gtoast.show { opacity: 1; }
    #gtoast.err { border-color: var(--error); color: var(--error); }
    #gconfirm, #gnew {
      position: fixed; inset: 0; background: var(--backdrop);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    #gconfirm.show, #gnew.show { display: flex; }
    .gdialog {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; max-width: 320px;
    }
    .gdialog p { margin: 0 0 12px; }
    .gdialog input[type=text] {
      width: 100%; box-sizing: border-box; margin: 0 0 12px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--fg); border-radius: 5px; padding: 4px 7px;
      font: 11px ui-monospace, Consolas, monospace; outline: none;
    }
    .gdialog input[type=text]:focus { border-color: var(--accent); }
    .gdialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
    .gdialog button {
      background: var(--bg3); color: var(--fg); border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 11px; cursor: pointer; font-size: 11px;
    }
    .gdialog button.primary { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <span id="gtitle">Dependency Graph</span>
    <span class="hint">drag socket &rarr; deps to wire &middot; click edge + Del
      to unlink &middot; double-click / <b>fx</b> opens the formula canvas
      &middot; right-click to add</span>
    <button id="gadd" title="Add a new attribute">+ attr</button>
  </header>
  <div id="rete"></div>
  <div id="gmsg">No parameter dependencies.</div>
  <div id="gtoast"></div>
  <div id="gconfirm"><div class="gdialog">
    <p id="gctext"></p>
    <div class="btns">
      <button id="gccancel" title="Keep the existing formula">Cancel</button>
      <button id="gcok" class="primary" title="Replace the attribute's formula">Replace</button>
    </div>
  </div></div>
  <div id="gnew"><div class="gdialog">
    <p>New attribute name</p>
    <input id="gnewname" type="text" placeholder="e.g. shelf_count"
      spellcheck="false" autocomplete="off">
    <div class="btns">
      <button id="gncancel" title="Close without adding">Cancel</button>
      <button id="gnok" class="primary" title="Create the attribute">Add</button>
    </div>
  </div></div>
  <script src="../vendor/vue.min.js"></script>
  <script src="../vendor/rete.min.js"></script>
  <script src="../vendor/connection-plugin.min.js"></script>
  <script src="../vendor/vue-render-plugin.min.js"></script>
  <script>
    // Minimal lodash stub — context-menu-plugin UMD expects window._
    // and only uses debounce()/isFunction().
    window._ = window._ || {
      debounce: function (fn, wait) {
        var t = null;
        function d() {
          var self = this, args = arguments;
          if (t) clearTimeout(t);
          t = setTimeout(function () { t = null; fn.apply(self, args); }, wait);
        }
        d.cancel = function () { if (t) { clearTimeout(t); t = null; } };
        return d;
      },
      isFunction: function (v) { return typeof v === 'function'; }
    };
  </script>
  <script src="../vendor/context-menu-plugin.min.js"></script>
  <script src="graph.js"></script>
</body>
</html>
