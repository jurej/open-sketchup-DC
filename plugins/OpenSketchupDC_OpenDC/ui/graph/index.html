<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open DC - Dependency Graph</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../vendor/litegraph.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #17181c; --bg2: #1e1f24; --bg3: #23242b;
      --fg: #d8d8de; --dim: #a9a9b2; --muted: #8a8a93;
      --accent: #4f9cf9; --accent2: #7fd0a2;
      --warn: #e69664; --error: #e66565; --border: #2a2b31;
      --fn: #b9a5f0;
      --node-shadow: rgba(0,0,0,.35); --menu-shadow: rgba(0,0,0,.55);
      --backdrop: rgba(0,0,0,.5);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eceef1; --bg2: #f6f7f9; --bg3: #ffffff;
      --fg: #23252d; --dim: #565b66; --muted: #747a88;
      --accent: #0d6dd8; --accent2: #157a47;
      --warn: #a05c10; --error: #c4323b; --border: #d3d6dc;
      --fn: #7a5cd0;
      --node-shadow: rgba(0,0,0,.14); --menu-shadow: rgba(0,0,0,.22);
      --backdrop: rgba(0,0,0,.3);
    }
    html, body { height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font: 11.5px/1.45 "Segoe UI", sans-serif; }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg); z-index: 10; position: relative;
    }
    #gback {
      display: none; background: var(--bg3); color: var(--accent);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 1px 8px 2px; cursor: pointer; font-size: 12px;
    }
    #gback:hover { border-color: var(--accent); }
    #gcrumbs { display: flex; align-items: center; gap: 1px;
      font-size: 12px; white-space: nowrap; min-width: 0; }
    #gcrumbs .gcr {
      color: var(--accent); cursor: pointer; padding: 1px 5px;
      border-radius: 4px; text-decoration: none;
    }
    #gcrumbs .gcr:hover { background: var(--bg3);
      text-decoration: underline; }
    #gcrumbs .gcur { color: var(--fg); font-weight: 600;
      padding: 1px 5px; overflow: hidden; text-overflow: ellipsis; }
    #gcrumbs .gsep { color: var(--dim); }
    .hint { font-size: 10px; color: var(--muted); }
    /* formula preview + apply bar, visible only inside a subgraph */
    #gsubbar {
      display: none; align-items: center; gap: 8px; flex: 1; min-width: 0;
      margin-left: 8px;
    }
    #gsubformula {
      flex: 1; min-width: 0; font: 10.5px ui-monospace, Consolas, monospace;
      color: var(--dim); overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; border: 1px solid var(--border); border-radius: 5px;
      padding: 3px 7px; background: var(--bg2);
    }
    #gsubformula.bad { border-color: var(--error); color: var(--error); }
    #gsubapply {
      background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 12px; cursor: pointer; font-size: 11px;
    }
    #gsubapply:disabled { opacity: .4; cursor: default; }
    #gadd {
      margin-left: auto; background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 11px; cursor: pointer; font-size: 11px;
    }
    #gadd:hover { background: var(--bg2); }
    #lgwrap { position: absolute; inset: 38px 0 0 0; }
    #lgcanvas { width: 100%; height: 100%; display: block; outline: none; }
    #gmsg {
      position: absolute; top: 60px; left: 0; right: 0;
      text-align: center; color: var(--muted); display: none;
      z-index: 5; pointer-events: none;
    }

    /* litegraph menus drawn in-page - theme via its CSS vars where
       possible, keep the dialog chrome ours */
    .litegraph .context-menu, .litegraph .litecontextmenu {
      background: var(--bg3) !important; color: var(--fg) !important;
      border: 1px solid var(--border) !important;
    }

    /* canvas chrome: toolbar, selection toolbox, minimap */
    #gtools, #gselbox {
      position: absolute; z-index: 6;
      display: flex; align-items: center; gap: 2px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 7px; padding: 3px 4px;
      box-shadow: 0 2px 8px var(--node-shadow);
    }
    #gtools { top: 10px; left: 10px; }
    #gselbox { display: none; z-index: 7;
      flex-direction: column; align-items: stretch; gap: 4px; }
    #gselbox .gsbrow { display: flex; align-items: center; gap: 2px;
      justify-content: center; }
    #gsbcolors { display: none; gap: 7px; padding: 2px 4px;
      justify-content: center; }
    #gsbcolors.show { display: flex; }
    .gsw {
      width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .28); box-sizing: border-box;
    }
    .gsw:hover { transform: scale(1.18); }
    .gsw.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
    .gsw.none { background: transparent; border-style: dashed; }
    .gtb {
      background: transparent; color: var(--dim);
      border: 1px solid transparent; border-radius: 5px;
      padding: 2px 7px; cursor: pointer; font-size: 11px;
      line-height: 1.3; min-width: 24px; white-space: nowrap;
    }
    .gtb:hover { background: var(--bg3); color: var(--fg); }
    .gtb svg { width: 13px; height: 13px; display: inline-block;
      vertical-align: -2px; stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round;
      stroke-linejoin: round; }
    .gtb.on { background: var(--bg3); color: var(--accent);
      border-color: var(--accent); }
    .gtsep { width: 1px; height: 15px; background: var(--border);
      margin: 0 3px; }
    #gtzoom { min-width: 38px; text-align: center; color: var(--muted);
      font-size: 10px; cursor: default; }
    #gfind {
      width: 86px; background: var(--bg3); color: var(--fg);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 2px 6px; outline: none; margin-left: 3px;
      font: 10.5px ui-monospace, Consolas, monospace;
    }
    #gfind:focus { border-color: var(--accent); }
    #gmini {
      position: absolute; right: 10px; bottom: 10px; z-index: 6;
      width: 180px; height: 120px; display: none;
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg2); opacity: .92; cursor: crosshair;
    }

    #gtoast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 11px; font-size: 11px;
      color: var(--fg); opacity: 0; transition: opacity .2s; z-index: 40;
      pointer-events: none; max-width: 90%;
    }
    #gtoast.show { opacity: 1; }
    #gtoast.err { border-color: var(--error); color: var(--error); }
    #gconfirm, #gnew, #grename {
      position: fixed; inset: 0; background: var(--backdrop);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    #gconfirm.show, #gnew.show, #grename.show { display: flex; }
    .gdialog {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; max-width: 320px;
    }
    .gdialog p { margin: 0 0 12px; }
    .gdialog input[type=text] {
      width: 100%; box-sizing: border-box; margin: 0 0 12px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--fg); border-radius: 5px; padding: 4px 7px;
      font: 11px ui-monospace, Consolas, monospace; outline: none;
    }
    .gdialog input[type=text]:focus { border-color: var(--accent); }
    .gdialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
    .gdialog button {
      background: var(--bg3); color: var(--fg); border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 11px; cursor: pointer; font-size: 11px;
    }
    .gdialog button.primary { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <button id="gback" title="Back one level">&#8249;</button>
    <nav id="gcrumbs"></nav>
    <span id="gsubbar">
      <span id="gsubformula" title="Live formula preview from the Ruby validator"></span>
      <button id="gsubapply" disabled
        title="Write the formula graph back as the attribute's formula">Apply</button>
    </span>
    <span class="hint">drag output &rarr; input to wire &middot; click link for
      options &middot; double-click a formula node to dive in &middot;
      right-click for actions</span>
    <button id="gadd" title="Add a new attribute">+ attr</button>
  </header>
  <div id="lgwrap"><canvas id="lgcanvas" tabindex="1"></canvas>
    <div id="gtools">
      <button id="gtpan" class="gtb on"
        title="Pan tool: drag the canvas (Ctrl+drag box-selects) [H]">Pan</button>
      <button id="gtsel" class="gtb"
        title="Select tool: drag a box around nodes (Space or middle-drag pans) [V]">Select</button>
      <span class="gtsep"></span>
      <button id="gtzout" class="gtb" title="Zoom out">&#8722;</button>
      <span id="gtzoom" title="Current zoom">100%</span>
      <button id="gtzin" class="gtb" title="Zoom in">+</button>
      <button id="gtfit" class="gtb"
        title="Fit the graph (or the selection) to the view [F]">Fit</button>
      <span class="gtsep"></span>
      <button id="gtsnap" class="gtb"
        title="Snap nodes to the grid while dragging">Snap</button>
      <button id="gtlink" class="gtb" title="Link drawing style">Spline</button>
      <button id="gtmap" class="gtb" title="Toggle the minimap [M]">Map</button>
      <input id="gfind" type="text" placeholder="find node" spellcheck="false"
        title="Find a node by title or attribute (Enter = next match)">
    </div>
    <div id="gselbox">
      <div id="gsbcolors"></div>
      <div class="gsbrow">
        <button id="gsbdel" class="gtb"
          title="Remove selected groups, folds and stencils"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M6 6l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13M10 10v6M14 10v6"/></svg></button>
        <button id="gsbinfo" class="gtb"
          title="Show the node's data name, scope and kind"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
        <button id="gsbcolor" class="gtb"
          title="Set the node color"><svg viewBox="0 0 24 24"><path d="M12 3c3.6 4.6 6 7.4 6 10a6 6 0 11-12 0c0-2.6 2.4-5.4 6-10z"/></svg></button>
        <button id="gsbcol" class="gtb"
          title="Collapse or expand the selected nodes"><svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
        <button id="gsbalign" class="gtb"
          title="Align or distribute the selected nodes"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h14"/></svg></button>
        <button id="gsbfold" class="gtb"
          title="Fold the selected nodes into a subgraph"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
        <button id="gsbunfold" class="gtb" style="display:none"
          title="Expand the selected fold proxies"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M3 16v3a2 2 0 002 2h3M9 9h6v6H9z"/></svg></button>
        <button id="gsbmore" class="gtb"
          title="More actions">&#8942;</button>
      </div>
    </div>
    <canvas id="gmini"></canvas>
  </div>
  <div id="gmsg">No parameter dependencies.</div>
  <div id="gtoast"></div>
  <div id="gconfirm"><div class="gdialog">
    <p id="gctext"></p>
    <div class="btns">
      <button id="gccancel" title="Keep the existing formula">Cancel</button>
      <button id="gcok" class="primary" title="Replace the attribute's formula">Replace</button>
    </div>
  </div></div>
  <div id="gnew"><div class="gdialog">
    <p>New attribute name</p>
    <input id="gnewname" type="text" placeholder="e.g. shelf_count"
      spellcheck="false" autocomplete="off">
    <div class="btns">
      <button id="gncancel" title="Close without adding">Cancel</button>
      <button id="gnok" class="primary" title="Create the attribute">Add</button>
    </div>
  </div></div>
  <div id="grename"><div class="gdialog">
    <p id="grtext">Rename</p>
    <input id="grname" type="text" spellcheck="false" autocomplete="off">
    <div class="btns">
      <button id="grreset" title="Back to the data-derived title">Reset</button>
      <button id="grcancel" title="Close without renaming">Cancel</button>
      <button id="grok" class="primary"
        title="Apply the display title">Rename</button>
    </div>
  </div></div>
  <script src="../vendor/litegraph.umd.js"></script>
  <script src="../astkit.js"></script>
  <script src="graph.js"></script>
</body>
</html>
