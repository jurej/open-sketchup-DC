<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open DC - Dependency Graph</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../vendor/litegraph.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #17181c; --bg2: #1e1f24; --bg3: #23242b;
      --fg: #d8d8de; --dim: #a9a9b2; --muted: #8a8a93;
      --accent: #4f9cf9; --accent2: #7fd0a2;
      --warn: #e69664; --error: #e66565; --border: #2a2b31;
      --fn: #b9a5f0;
      --node-shadow: rgba(0,0,0,.35); --menu-shadow: rgba(0,0,0,.55);
      --backdrop: rgba(0,0,0,.5);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eceef1; --bg2: #f6f7f9; --bg3: #ffffff;
      --fg: #23252d; --dim: #565b66; --muted: #747a88;
      --accent: #0d6dd8; --accent2: #157a47;
      --warn: #a05c10; --error: #c4323b; --border: #d3d6dc;
      --fn: #7a5cd0;
      --node-shadow: rgba(0,0,0,.14); --menu-shadow: rgba(0,0,0,.22);
      --backdrop: rgba(0,0,0,.3);
    }
    html, body { height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font: 11.5px/1.45 "Segoe UI", sans-serif; }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg); z-index: 10; position: relative;
    }
    #gtitle { font-weight: 600; color: var(--accent); white-space: nowrap; }
    #gback {
      display: none; background: var(--bg3); color: var(--accent);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 2px 10px; cursor: pointer; font-size: 11px;
    }
    #gback:hover { border-color: var(--accent); }
    #gcrumb { color: var(--dim); font-size: 11px;
      font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
    .hint { font-size: 10px; color: var(--muted); }
    /* formula preview + apply bar, visible only inside a subgraph */
    #gsubbar {
      display: none; align-items: center; gap: 8px; flex: 1; min-width: 0;
      margin-left: 8px;
    }
    #gsubformula {
      flex: 1; min-width: 0; font: 10.5px ui-monospace, Consolas, monospace;
      color: var(--dim); overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; border: 1px solid var(--border); border-radius: 5px;
      padding: 3px 7px; background: var(--bg2);
    }
    #gsubformula.bad { border-color: var(--error); color: var(--error); }
    #gsubapply {
      background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 12px; cursor: pointer; font-size: 11px;
    }
    #gsubapply:disabled { opacity: .4; cursor: default; }
    #gadd {
      margin-left: auto; background: var(--bg3); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px;
      padding: 3px 11px; cursor: pointer; font-size: 11px;
    }
    #gadd:hover { background: var(--bg2); }
    #lgwrap { position: absolute; inset: 38px 0 0 0; }
    #lgcanvas { width: 100%; height: 100%; display: block; outline: none; }
    #gmsg {
      position: absolute; top: 60px; left: 0; right: 0;
      text-align: center; color: var(--muted); display: none;
      z-index: 5; pointer-events: none;
    }

    /* litegraph menus drawn in-page - theme via its CSS vars where
       possible, keep the dialog chrome ours */
    .litegraph .context-menu, .litegraph .litecontextmenu {
      background: var(--bg3) !important; color: var(--fg) !important;
      border: 1px solid var(--border) !important;
    }

    #gtoast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 11px; font-size: 11px;
      color: var(--fg); opacity: 0; transition: opacity .2s; z-index: 40;
      pointer-events: none; max-width: 90%;
    }
    #gtoast.show { opacity: 1; }
    #gtoast.err { border-color: var(--error); color: var(--error); }
    #gconfirm, #gnew {
      position: fixed; inset: 0; background: var(--backdrop);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    #gconfirm.show, #gnew.show { display: flex; }
    .gdialog {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; max-width: 320px;
    }
    .gdialog p { margin: 0 0 12px; }
    .gdialog input[type=text] {
      width: 100%; box-sizing: border-box; margin: 0 0 12px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--fg); border-radius: 5px; padding: 4px 7px;
      font: 11px ui-monospace, Consolas, monospace; outline: none;
    }
    .gdialog input[type=text]:focus { border-color: var(--accent); }
    .gdialog .btns { display: flex; gap: 8px; justify-content: flex-end; }
    .gdialog button {
      background: var(--bg3); color: var(--fg); border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 11px; cursor: pointer; font-size: 11px;
    }
    .gdialog button.primary { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <button id="gback" title="Back to the dependency graph">&larr; back</button>
    <span id="gtitle">Dependency Graph</span>
    <span id="gcrumb"></span>
    <span id="gsubbar">
      <span id="gsubformula" title="Live formula preview from the Ruby validator"></span>
      <button id="gsubapply" disabled
        title="Write the formula graph back as the attribute's formula">Apply</button>
    </span>
    <span class="hint">drag output &rarr; input to wire &middot; click link for
      options &middot; double-click a formula node to dive in &middot;
      right-click for actions</span>
    <button id="gadd" title="Add a new attribute">+ attr</button>
  </header>
  <div id="lgwrap"><canvas id="lgcanvas" tabindex="1"></canvas></div>
  <div id="gmsg">No parameter dependencies.</div>
  <div id="gtoast"></div>
  <div id="gconfirm"><div class="gdialog">
    <p id="gctext"></p>
    <div class="btns">
      <button id="gccancel" title="Keep the existing formula">Cancel</button>
      <button id="gcok" class="primary" title="Replace the attribute's formula">Replace</button>
    </div>
  </div></div>
  <div id="gnew"><div class="gdialog">
    <p>New attribute name</p>
    <input id="gnewname" type="text" placeholder="e.g. shelf_count"
      spellcheck="false" autocomplete="off">
    <div class="btns">
      <button id="gncancel" title="Close without adding">Cancel</button>
      <button id="gnok" class="primary" title="Create the attribute">Add</button>
    </div>
  </div></div>
  <script src="../vendor/litegraph.umd.js"></script>
  <script src="../astkit.js"></script>
  <script src="graph.js"></script>
</body>
</html>
