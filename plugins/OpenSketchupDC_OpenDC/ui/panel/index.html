<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open DC</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="toolbar">
    <span class="title">Open DC</span>
    <input id="search" type="search" placeholder="Filter parameters…">
    <button id="btn-refresh" title="Refresh panel">⟳</button>
    <button id="btn-redraw" class="confirm" title="Recompute / redraw model">▶</button>
    <button id="btn-config" title="Configure - authoring tools (formulas, structure, ordering)">⚙</button>
  </header>

  <div id="banner" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <main id="content">
    <section id="batch" class="hidden"></section>
    <section id="entities"></section>
    <div id="empty" class="hidden">
      <p>No components selected.</p>
      <p class="hint">Select a component or group - add an attribute in
         ⚙ configure mode to make it dynamic.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
